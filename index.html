<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SavvyNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div>
            <p class="brand-label">Finance</p>
            <h1>SavvyNest</h1>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item active">
            <span>Overview</span>
          </button>
          <button class="nav-item">
            <span>Goals</span>
          </button>
          <button class="nav-item">
            <span>Transactions</span>
          </button>
          <button class="nav-item">
            <span>Insights</span>
          </button>
        </nav>

        <div class="sidebar-card">
          <p class="eyebrow">Monthly target</p>
          <h3>$1,200</h3>
          <div class="mini-progress">
            <span style="width: 72%"></span>
          </div>
          <small>72% of target reached</small>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Welcome back</p>
            <h2>Good morning, Alex</h2>
          </div>
          <div class="top-actions">
            <button class="secondary-btn">Export</button>
            <button class="primary-btn">+ Add transaction</button>
          </div>
        </header>

        <section class="stats-grid" id="statsGrid"></section>

        <section class="content-grid">
          <div class="panel goals-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Savings goals</p>
                <h3>Active goals</h3>
              </div>
              <button class="secondary-btn" id="openGoalModal">+ New goal</button>
            </div>
            <div id="goalsList" class="goals-list"></div>
          </div>

          <div class="panel budget-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Spending</p>
                <h3>Budget overview</h3>
              </div>
            </div>
            <div id="budgetList" class="budget-list"></div>
          </div>
        </section>

        <section class="panel transactions-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Activity</p>
              <h3>Recent transactions</h3>
            </div>
            <button class="secondary-btn" id="openTransactionModal">+ Add expense</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Date</th>
                  <th>Type</th>
                  <th class="align-right">Amount</th>
                </tr>
              </thead>
              <tbody id="transactionsTable"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div class="modal hidden" id="goalModal">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Create savings goal</h3>
          <button class="icon-btn" data-close="goalModal">✕</button>
        </div>
        <form id="goalForm">
          <div class="field-grid">
            <label>
              Goal name
              <input type="text" name="name" placeholder="Emergency fund" required />
            </label>
            <label>
              Category
              <select name="category" required>
                <option value="Emergency">Emergency</option>
                <option value="Travel">Travel</option>
                <option value="Home">Home</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
              </select>
            </label>
            <label>
              Target amount
              <input type="number" name="target" min="1" placeholder="5000" required />
            </label>
            <label>
              Current saved
              <input type="number" name="saved" min="0" placeholder="1500" required />
            </label>
          </div>
          <button type="submit" class="primary-btn full-width">Save goal</button>
        </form>
      </div>
    </div>

    <div class="modal hidden" id="transactionModal">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Add transaction</h3>
          <button class="icon-btn" data-close="transactionModal">✕</button>
        </div>
        <form id="transactionForm">
          <div class="field-grid">
            <label>
              Title
              <input type="text" name="title" placeholder="Groceries" required />
            </label>
            <label>
              Category
              <select name="category" required>
                <option value="Food">Food</option>
                <option value="Housing">Housing</option>
                <option value="Transport">Transport</option>
                <option value="Utilities">Utilities</option>
                <option value="Income">Income</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </label>
            <label>
              Amount
              <input type="number" name="amount" min="1" placeholder="120" required />
            </label>
            <label>
              Type
              <select name="type" required>
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </label>
          </div>
          <button type="submit" class="primary-btn full-width">Save transaction</button>
        </form>
      </div>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
